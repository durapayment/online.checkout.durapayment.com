<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundWave Pro X - Premium Wireless Headphones</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #0b3371;
        min-height: 100vh;
        /* display: flex; */
        /* align-items: center; */
        /* justify-content: center; */
        /* padding: 20px; */
      }

      .container {
        max-width: 1000px;
        width: 100%;
        background: white;
        border-radius: 0px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: grid;
        height: 100svh;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }

      .product-image {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 40px;
        position: relative;
      }

      .product-image::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(102, 126, 234, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }

      .headphone-emoji {
        font-size: 200px;
        filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
        position: relative;
        z-index: 1;
      }

      .product-details {
        padding: 30px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .badge {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 20px;
        width: fit-content;
      }

      h1 {
        font-size: 36px;
        color: #1a202c;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .subtitle {
        color: #718096;
        font-size: 16px;
        margin-bottom: 30px;
      }

      .price {
        font-size: 38px;
        font-weight: 700;
        color: #667eea;
        margin-bottom: 30px;
      }

      .features {
        list-style: none;
        margin-bottom: 40px;
      }

      .features li {
        padding: 12px 0;
        color: #4a5568;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .features li::before {
        content: "✓";
        display: inline-block;
        width: 24px;
        height: 24px;
        background: #0b3371;
        color: white;
        border-radius: 50%;
        text-align: center;
        line-height: 24px;
        font-weight: bold;
        font-size: 14px;
        flex-shrink: 0;
      }

      .buy-button {
        background: #0b3371;
        color: white;
        border: none;
        padding: 14px 40px;
        font-size: 18px;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .buy-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .buy-button:active {
        transform: translateY(0);
      }

      .security-note {
        margin-top: 20px;
        font-size: 13px;
        color: #a0aec0;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        .product-image {
          padding: 40px 20px;
        }

        .headphone-emoji {
          font-size: 120px;
        }

        .product-details {
          padding: 40px 30px;
        }

        h1 {
          font-size: 28px;
        }

        .price {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="product-image">
        <div class="headphone-emoji">🎧</div>
      </div>

      <div class="product-details">
        <span class="badge">Premium Audio</span>
        <h1>SoundWave Pro X</h1>
        <p class="subtitle">Experience studio-quality sound anywhere</p>

        <div class="price">₦350</div>

        <ul class="features">
          <li>Active Noise Cancellation (ANC)</li>
          <li>40-hour battery life</li>
          <li>Premium leather ear cushions</li>
        </ul>

        <button
          class="buy-button"
          onclick="
            Smharty.checkout({
              public_key: 'pk_live_H8gmtyCNaRNGIbIP0lHzveTd80m9XJvf',
              amount: 350,
              customer_email: 'blessing010@gmail.com',
              customer_firstname: 'Blessing',
              customer_lastname: 'Oluwaseun',
              customer_phone: '08143323456',
              currency: 'NGN', // NGN only
              redirect_url: 'https://radiustechsolutions.com',
            })
          "
        >
          Buy Now
        </button>

        <div class="security-note">🔒 Secure payment powered by Smharty</div>
      </div>
    </div>

    <script src="http://checkout.smharty.com/smharty.js"></script>
  </body>
</html>
