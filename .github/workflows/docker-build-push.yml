name: Build & Push Docker Image → Update Helm Chart

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKER_REPO: smhartgroup/smhartgroup
  IMAGE_TAG: checkout-frontend
  HELM_CHARTS_REPO: git@github.com:Smhart-group/smharty-helm-charts.git
  HELM_VALUES_FILE: checkout-frontend/values.yaml

jobs:
  build-and-push:
    name: Build Docker Image & Update Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout source ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ──────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 4. Build & push image ────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Write SSH deploy key for helm-charts repo ─────────────────────
      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HELM_CHARTS_DEPLOY_KEY }}" > ~/.ssh/helm_deploy_key
          chmod 600 ~/.ssh/helm_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.com
            IdentityFile ~/.ssh/helm_deploy_key
            StrictHostKeyChecking no
          EOF

      # ── 6. Clone helm-charts repo ─────────────────────────────────────────
      - name: Clone smharty-helm-charts
        run: |
          git clone ${{ env.HELM_CHARTS_REPO }} helm-charts

      # ── 7. Update image tag in values.yaml ───────────────────────────────
      - name: Update image tag in Helm values
        run: |
          cd helm-charts
          sed -i "s|tag:.*|tag: ${{ env.IMAGE_TAG }}|" ${{ env.HELM_VALUES_FILE }}
          grep "tag:" ${{ env.HELM_VALUES_FILE }}

      # ── 8. Commit & push updated values.yaml ──────────────────────────────
      - name: Commit and push Helm chart update
        run: |
          cd helm-charts
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ${{ env.HELM_VALUES_FILE }}
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(checkout-frontend): update image to ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}

          Triggered by commit ${{ github.sha }}
          Repo: ${{ github.repository }}
          Ref:  ${{ github.ref }}"
          git push origin main

      # ── 9. Summary ───────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### Docker Build & Helm Update" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Helm Chart** | \`${{ env.HELM_VALUES_FILE }}\` |" >> $GITHUB_STEP_SUMMARY
